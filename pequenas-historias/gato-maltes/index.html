<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe5">
<title>Pequenas Histórias — Leitor</title>
<style>
:root{color-scheme:light;--ink:#29342e;--muted:#707a72;--paper:#fffdf8;--canvas:#f4efe5;--accent:#db8246;--line:#e6dfd3;--green:#dce9df;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--canvas);color:var(--ink);display:flex;flex-direction:column}.top{width:min(100%,1050px);margin:0 auto;padding:24px 24px 12px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--green);color:#4c6b59;font-size:1.2rem}.title{margin:0;font:700 1.18rem/1.2 Georgia,'Times New Roman',serif;letter-spacing:-.02em}.subtitle{margin:4px 0 0;font-size:.8rem;color:var(--muted)}.hint{font-size:.76rem;color:var(--muted);text-align:right}.reader{width:min(100%,1050px);margin:0 auto;padding:10px 24px 22px;display:flex;flex:1;min-height:0;flex-direction:column}.stage{position:relative;flex:1;min-height:220px;display:grid;place-items:center;padding:14px 70px;background:#eae4d9;border:1px solid #e2dbce;border-radius:24px;overflow:hidden}.page{display:block;max-width:100%;max-height:min(70svh,850px);width:auto;height:auto;object-fit:contain;background:white;box-shadow:0 10px 34px #25352c20;transition:opacity .16s ease}.page.changing{opacity:.45}.side-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;display:grid;place-items:center;border:1px solid #ded7cb;border-radius:50%;background:#fffdf8eF;color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;box-shadow:0 3px 10px #29342e12;transition:transform .15s,background .15s}.side-nav:hover:not(:disabled){background:white;transform:translateY(-50%) scale(1.06)}.side-nav:disabled{opacity:.38;cursor:default}.side-nav.prev{left:14px}.side-nav.next{right:14px}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px 2px 0}.nav-button{justify-self:start;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);padding:10px 16px;font-weight:650;cursor:pointer}.nav-button.next-button{justify-self:end;background:var(--ink);border-color:var(--ink);color:white}.nav-button:disabled{opacity:.42;cursor:default}.nav-button:not(:disabled):hover{filter:brightness(.96)}.status{min-width:155px;text-align:center}.counter{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}.track{height:4px;width:130px;max-width:100%;margin:7px auto 0;background:#ded8cc;border-radius:9px;overflow:hidden}.fill{height:100%;width:20%;background:var(--accent);border-radius:inherit;transition:width .22s ease}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button:focus-visible{outline:3px solid #e8874880;outline-offset:3px}@media(max-width:600px){.top{padding:15px 16px 9px}.mark{width:36px;height:36px}.title{font-size:1.08rem}.subtitle{font-size:.74rem}.hint{display:none}.reader{padding:6px 10px max(12px,env(safe-area-inset-bottom))}.stage{padding:8px 38px;border-radius:18px}.page{max-width:100%;max-height:calc(100svh - 185px)}.side-nav{width:37px;height:37px;font-size:1.2rem}.side-nav.prev{left:5px}.side-nav.next{right:5px}.controls{gap:4px;padding-top:12px}.nav-button{padding:10px 12px;gap:5px;font-size:.85rem}.status{min-width:95px}.track{width:82px}.counter{font-size:.72rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark" aria-hidden="true">✦</div><div><h1 class="title">Pequenas Histórias</h1><p class="subtitle">Lê ao teu ritmo, página a página.</p></div></div><div class="hint">Também podes usar as setas do teclado ← →</div></header>
<main class="reader" aria-label="Leitor de história">
<section class="stage" aria-label="Página da história"><button class="side-nav prev" id="sidePrev" type="button" aria-label="Página anterior">‹</button><img class="page" id="pageImage" alt="Página 1 da história" draggable="false"><button class="side-nav next" id="sideNext" type="button" aria-label="Página seguinte">›</button></section>
<div class="controls"><button class="nav-button" id="prev" type="button"><span aria-hidden="true">←</span> Anterior</button><div class="status" aria-live="polite"><div class="counter" id="counter">Página 1 de 5</div><div class="track" role="progressbar" aria-label="Progresso da leitura" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" id="progress"><div class="fill" id="fill"></div></div></div><button class="nav-button next-button" id="next" type="button">Seguinte <span aria-hidden="true">→</span></button></div>
<div class="sr-only" id="announcement" aria-live="polite"></div>
</main>
<script>
const pages = [
  "História.1.png",
  "História.2.png",
  "História.3.png",
  "História.4.png",
  "História.5.png"
];
let current = 0;
const image = document.getElementById('pageImage');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const fill = document.getElementById('fill');
const prevButtons = [document.getElementById('prev'), document.getElementById('sidePrev')];
const nextButtons = [document.getElementById('next'), document.getElementById('sideNext')];
function showPage(index) {
  current = Math.max(0, Math.min(pages.length - 1, index));
  image.classList.add('changing');
  const nextImage = new Image();
  nextImage.onload = () => {
    image.src = pages[current];
    image.alt = `Página ${current + 1} da história`;
    image.classList.remove('changing');
  };
  nextImage.src = pages[current];
  const n = current + 1;
  counter.textContent = `Página ${n} de ${pages.length}`;
  progress.setAttribute('aria-valuenow', n);
  fill.style.width = `${n / pages.length * 100}%`;
  prevButtons.forEach(button => button.disabled = current === 0);
  nextButtons.forEach(button => button.disabled = current === pages.length - 1);
  document.getElementById('announcement').textContent = `Página ${n} de ${pages.length}`;
  [pages[current - 1], pages[current + 1]].filter(Boolean).forEach(src => { const preload = new Image(); preload.src = src; });
}
prevButtons.forEach(button => button.addEventListener('click', () => showPage(current - 1)));
nextButtons.forEach(button => button.addEventListener('click', () => showPage(current + 1)));
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === 'ArrowRight') { event.preventDefault(); showPage(current + 1); }
  if (event.key === 'ArrowLeft') { event.preventDefault(); showPage(current - 1); }
  if (event.key === 'Home') showPage(0);
  if (event.key === 'End') showPage(pages.length - 1);
});
let touchStartX = null;
document.querySelector('.stage').addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].clientX; }, {passive:true});
document.querySelector('.stage').addEventListener('touchend', event => {
  if (touchStartX === null) return;
  const delta = event.changedTouches[0].clientX - touchStartX;
  if (Math.abs(delta) > 55) showPage(current + (delta < 0 ? 1 : -1));
  touchStartX = null;
}, {passive:true});
showPage(0);
</script>
</body>
</html>
